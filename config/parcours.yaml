# config/parcours.yaml — réponses CANONIQUES pour les événements de cycle de vie d'un
# agent (arrivée / départ / mutation). Ce sont les demandes les plus fréquentes de la
# CPA et elles croisent plusieurs procédures de domaines différents — le RAG ne sait
# pas les synthétiser de façon fiable (D8). Ici, une réponse rédigée à la main, tracée
# aux fiches, servie avant le RAG.
#
# ⚠️ validated: false  → /health le signale, la réponse porte un avertissement.
#    Passer à true après relecture par le chef de cellule CPA.
#
# Détection : `patterns` = sous-chaînes (insensible casse/accents). `anti` = si présent,
#    on NE déclenche PAS (évite « mutation » de capter « départ »).
#
# MAJ 2026-09-19 (migration hybride, voir corpus/02-procedures-hybride/
# 00-correspondance-trois-corpus.md) : les trois parcours pointent maintenant vers
# PROC-ID-H01 (fusion ID-001+002+003), dont le discriminant N'EST PAS le type de poste
# mais le raccordement du SERVICE de l'agent à IdentityDSI (🟠 hors IdentityDSI /
# 🔵 raccordé). Les anciens codes ID-001/002/003 sont archivés.

version: 1
validated: false

parcours:
  - id: depart-agent
    titre: "Départ d'un agent"
    patterns:
      - "depart d'un agent"
      - "un agent quitte"
      - "un agent part"
      - "agent qui s'en va"
      - "fin de contrat"
      - "agent qui part a la retraite"
      - "que faire quand un agent quitte"
      - "offboarding"
    anti: ["mutation", "change de service"]
    fiches: [PROC-ID-H01, PROC-STOCK-H03, PROC-INT-H03]
    reponse: |
      Le départ d'un agent se traite d'abord côté identité — PROC-ID-H01 (règle
      invariante validée par la DPO : le compte suit l'agent, il est SUPPRIMÉ au
      départ, sans exception) :
      • identifier le service de rattachement de l'agent et vérifier s'il est raccordé
        à IdentityDSI (liste tenue par la CPA) ;
      • 🟠 hors IdentityDSI : supprimer le compte à la date d'effet (Gestionnaire de
        comptes) ; 🔵 raccordé : vérifier que la sortie a bien été saisie dans le SIRH,
        ce qui déclenche la suppression — sinon le délai relève de la DRH ;
      • traiter délégations, redirections et boîtes partagées AVANT la suppression ;
      • aucune donnée n'est conservée sur le compte supprimé : les données utiles sont
        déplacées avant la date d'effet, sur l'espace de stockage de référence.

      Puis le matériel :
      1. Retrait de l'appareil — PROC-INT-H03 : désinscrire l'appareil (console Intune
         si poste 🔵) ou le sortir de l'annuaire local et effacer (poste 🟠).
      2. Retour en stock — PROC-STOCK-H03 : zone de conservation isolée du stock neuf,
         effacement puis remise en zone à préparer (🟠) ou prêt à doter (🔵). La durée
         de conservation avant effacement dépend d'une politique d'archivage — non
         encore établie (écart P1).

      Filet de sécurité : un compte à supprimer découvert hors ticket de départ
      (ex. lors d'une réaffectation de poste) est désactivé immédiatement, un ticket
      est créé pour tracer la découverte, et le service + la DRH sont alertés.

  - id: arrivee-agent
    titre: "Arrivée d'un nouvel agent (utilisateur final)"
    patterns:
      - "arrivee d'un agent"
      - "nouvel agent"
      - "nouveau collaborateur"
      - "nouvel arrivant"
      - "un agent arrive"
      - "prise de poste"
      - "que faire pour un nouvel agent"
      - "creer un poste pour un nouvel agent"
    anti: ["depart", "quitte", "mutation"]
    fiches: [PROC-ID-H01, PROC-STOCK-H02, PROC-ATL-H01, PROC-TER-H02]
    reponse: |
      L'arrivée d'un agent se traite d'abord côté identité — PROC-ID-H01. Vérifier
      d'abord si le service de rattachement de l'agent est raccordé à IdentityDSI
      (liste tenue par la CPA) : en cas de doute, traiter selon 🟠 et signaler l'écart.

      • 🟠 hors IdentityDSI : créer le compte manuellement dans EntraID à partir du
        ticket, appliquer la convention de nommage, renseigner service/fonction/
        licence, créer la boîte aux lettres.
      • 🔵 raccordé : vérifier que la fiche agent existe dans le SIRH, attendre le
        provisionnement automatique par IdentityDSI puis en contrôler le résultat —
        toute correction se fait dans le SIRH, jamais dans la console.
      • Dans les deux cas : vérifier qu'aucun compte n'existe déjà pour cet agent
        (mutation interne), puis inscrire l'agent au MFA.

      Puis le matériel, sur nouveaux tickets Tauturu :
      1. Dotation — PROC-STOCK-H02 : vérifier la demande validée et l'existence du
         compte (sinon le ticket est clôturé ou mis en attente).
      2. Préparation ou contrôle du poste — PROC-ATL-H01 : ~2h de préparation sur un
         poste 🟠 MDT, quelques minutes de contrôle de conformité sur un poste 🔵 Intune.
      3. Livraison — PROC-TER-H02 : installation sur site, finalisation de session EN
         PRÉSENCE du bénéficiaire (~45 min sur poste 🟠, ~15 min sur poste 🔵).

      SLA cible dotation : 7 jours ouvrés.

  - id: mutation-agent
    titre: "Mutation / changement de service d'un agent"
    patterns:
      - "mutation"
      - "mute"
      - "changement de service"
      - "change de service"
      - "change de direction"
      - "autre service"
      - "autre direction"
      - "reaffectation"
      - "reaffecte"
      - "change d'affectation"
    anti: ["depart", "quitte", "nouvel agent", "nouveau collaborateur"]
    fiches: [PROC-ID-H01, PROC-STOCK-H03, PROC-TER-H02]
    reponse: |
      Contrairement à l'intuition, une mutation ne « modifie » pas le compte — PROC-ID-H01
      (règle validée par la DPO) : le compte de l'agent est SUPPRIMÉ côté service
      d'origine, puis un nouveau compte est créé côté service d'accueil. Sans exception.

      • 🟠 service d'accueil hors IdentityDSI : supprimer le compte d'origine, puis créer
        le nouveau compte selon la colonne applicable **au service d'accueil** — pas à
        celui d'origine.
      • 🔵 service d'accueil raccordé : vérifier que la mutation est saisie dans le SIRH
        (déclenche suppression + reprovisionnement), ou basculer sur 🟠 si le service
        d'accueil n'est pas raccordé.

      Le poste suit ensuite : retour en stock (PROC-STOCK-H03) si l'agent n'en a plus
      besoin, ou réaffectation sur site (PROC-TER-H02) s'il change de bureau. Vérifier
      les groupes/profils Intune si le nouveau service a un profil différent.
