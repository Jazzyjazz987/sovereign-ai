# Règles d'alerte — alignées sur les métriques RÉELLEMENT produites (voir
# docs/REVUE_CRITIQUE_2026-09-07.md constat 12). Exporters : node-exporter,
# postgres-exporter, gpu-exporter (nvidia_smi_*), + /metrics de langgraph / anone / rag.

groups:
  - name: sovereign_ai_services
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up{job=~"langgraph|anone|rag|node|postgres"} == 0
        for: 2m
        annotations:
          summary: "Service {{ $labels.job }} injoignable"
          description: "Scrape Prometheus en échec depuis 2 min"

      - alert: LangGraphErrorRate
        expr: sum(rate(query_requests_total{status="error"}[5m])) / clamp_min(sum(rate(query_requests_total[5m])), 0.001) > 0.1
        for: 3m
        annotations:
          summary: "Taux d'erreur /query > 10 %"
          description: "{{ $value | humanizePercentage }} sur 5 min"

      - alert: QueryLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(query_latency_seconds_bucket{tier=~"RAG|T1|T2|T3|T4"}[10m]))) > 20
        for: 5m
        annotations:
          summary: "Latence /query p95 > 20 s (voies locales)"
          description: "p95 = {{ $value }} s"

      - alert: AnoneDown
        expr: increase(anonymize_requests_total{status="503"}[10m]) > 3
        for: 2m
        annotations:
          summary: "Agent Anone en échec (503)"
          description: "{{ $value }} échecs en 10 min — T5 bascule en repli local"

  - name: sovereign_ai_rag
    interval: 30s
    rules:
      - alert: RagContractBroken
        expr: increase(rag_answers_total{outcome="parse_error"}[15m]) > 3
        for: 5m
        annotations:
          summary: "Contrat JSON du RAG cassé"
          description: "parse_error x{{ $value }} en 15 min — MAJ du modèle qwen ? prompt ?"

      - alert: RagCitationRejects
        expr: increase(rag_answers_total{outcome="citation_invalide"}[1h]) > 5
        for: 10m
        annotations:
          summary: "RAG rejette des réponses pour citation hors extraits"
          description: "{{ $value }} rejets en 1 h — modèle qui hallucine des codes PROC-*"

      - alert: RagSearchSaturated
        expr: increase(rag_search_busy_total[10m]) > 5
        for: 5m
        annotations:
          summary: "RAG /search sature (503 occupé)"
          description: "{{ $value }} refus en 10 min — augmenter RAG_MAX_CONCURRENCY ou la capacité"

      - alert: RagUngatedHigh
        expr: rate(query_ungated_no_scope_total[1h]) > 0.1
        for: 30m
        annotations:
          summary: "Requêtes non filtrées fréquentes"
          description: "{{ $value }}/s — blocklist hors-périmètre à compléter OU fiches manquantes"

      - alert: RagUnavailable
        expr: increase(rag_answers_total{outcome="unavailable"}[10m]) > 3
        for: 5m
        annotations:
          summary: "Service RAG injoignable depuis l'orchestrateur"
          description: "{{ $value }} échecs en 10 min — la cascade prend le relais"

      - alert: QueryDeadlineHit
        expr: increase(query_requests_total{tier="timeout"}[10m]) > 0
        for: 1m
        annotations:
          summary: "Requêtes /query en délai dépassé"
          description: "{{ $value }} en 10 min — Ollama figé ou surcharge"

  - name: sovereign_ai_t5
    interval: 30s
    rules:
      - alert: T5CloudCallsSpike
        expr: increase(t5_cloud_calls_total[1h]) > 20
        for: 5m
        annotations:
          summary: "Appels cloud T5 anormalement fréquents"
          description: "{{ $value }} appels Anthropic en 1 h — budget / boucle ?"

  - name: sovereign_ai_infrastructure
    interval: 30s
    rules:
      - alert: DiskUsageHigh
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/host",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/host",fstype!~"tmpfs|overlay"})) * 100 > 85
        for: 5m
        annotations:
          summary: "Disque > 85 %"
          description: "{{ $value | humanize }} % utilisé — purger le cache Docker (images/build)"

      - alert: MemoryUsageHigh
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        annotations:
          summary: "RAM système > 90 %"
          description: "{{ $value | humanize }} %"

      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        annotations:
          summary: "PostgreSQL injoignable (pgvector — cœur du RAG)"
          description: "pg_up == 0"

      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) > 80
        for: 3m
        annotations:
          summary: "PostgreSQL > 80 connexions"
          description: "{{ $value }} connexions actives"
