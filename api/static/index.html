<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant CPA — DSI Polynésie française</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --ink:#1c2530; --muted:#5b6b7c; --line:#dde3ea;
    --accent:#1f6feb; --accent-d:#1a5fd0;
    --ok:#127a3d; --ok-bg:#e6f4ea; --warn:#8a5a00; --warn-bg:#fef3d9;
    --none:#5b6b7c; --none-bg:#eef1f4; --danger:#a4262c; --danger-bg:#fde7e9;
    --draft:#5a3fb0; --draft-bg:#efeafc;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#12161c; --card:#1b2129; --ink:#e6ebf1; --muted:#9fb0c0; --line:#2b333d;
      --ok-bg:#12301e; --warn-bg:#332a12; --none-bg:#242a31; --danger-bg:#3a1b1e; --draft-bg:#241c3a; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card)}
  header b{font-size:15px} header span{color:var(--muted);font-size:13px}
  main{max-width:820px;margin:0 auto;padding:20px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
  textarea{width:100%;min-height:80px;padding:10px;border:1px solid var(--line);border-radius:8px;
    font:inherit;background:var(--bg);color:var(--ink);resize:vertical}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 16px;
    font:inherit;font-weight:600;cursor:pointer}
  button:hover{background:var(--accent-d)} button:disabled{opacity:.5;cursor:default}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg label{padding:8px 12px;cursor:pointer;font-size:13px;color:var(--muted)}
  .seg input{display:none}
  .seg input:checked + span{background:var(--accent);color:#fff;display:inline-block;padding:8px 12px;margin:-8px -12px}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .b-ok{background:var(--ok-bg);color:var(--ok)}
  .b-warn{background:var(--warn-bg);color:var(--warn)}
  .b-none{background:var(--none-bg);color:var(--none)}
  .b-danger{background:var(--danger-bg);color:var(--danger)}
  .b-draft{background:var(--draft-bg);color:var(--draft)}
  .answer{white-space:pre-wrap;margin-top:12px}
  .fiches{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
  .fiches h4{margin:0 0 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .fiche{font-size:13px;margin:3px 0}
  .fiche a{color:var(--accent);text-decoration:none} .fiche a:hover{text-decoration:underline}
  .fiche .sc{color:var(--muted);font-size:12px}
  .note{font-size:12px;color:var(--muted);margin-top:10px}
  .warnbar{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:12px}
  .err{color:var(--danger)}
</style>
</head>
<body>
<header><b>Assistant CPA</b> &nbsp;<span>Cellule Parc &amp; Assistance — DSI Polynésie française · copilote de support</span></header>
<main>
  <div class="box">
    <textarea id="q" placeholder="Ex. : comment réinitialiser le MFA d'un agent ?  —  ou collez le problème de l'utilisateur pour rédiger la réponse."></textarea>
    <div class="row">
      <span class="seg">
        <label><input type="radio" name="mode" value="question" checked><span>Répondre à ma question</span></label>
        <label><input type="radio" name="mode" value="redaction"><span>Rédiger la réponse à l'utilisateur</span></label>
      </span>
      <button id="go">Envoyer</button>
      <span id="spin" class="note" hidden>traitement…</span>
    </div>
  </div>

  <div class="box" id="out" hidden>
    <div id="head"></div>
    <div class="answer" id="answer"></div>
    <div id="fiches"></div>
    <div id="extra"></div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const CASCADE = ["T1","T2","T3","T4","T5","T4-fallback","T3-fallback"];

const STYLE = {
  "RAG":            {cls:"b-ok",   txt:"Fondé sur fiches CPA"},
  "RAG-redaction":  {cls:"b-draft",txt:"Brouillon — à relire avant envoi"},
  "parcours":       {cls:"b-ok",   txt:"Parcours de référence CPA"},
  "aucune-fiche":   {cls:"b-none", txt:"Aucune fiche"},
  "hors-perimetre": {cls:"b-none", txt:"Hors périmètre"},
  "sauvegarde":     {cls:"b-danger",txt:"Voie de sauvegarde"},
  "timeout":        {cls:"b-danger",txt:"Délai dépassé"},
};

function render(d){
  $("#out").hidden = false;
  const tier = d.tier || "?";
  let st = STYLE[tier];
  if(!st) st = CASCADE.includes(tier)
      ? {cls:"b-warn", txt:"Généré localement — à vérifier"}
      : {cls:"b-none", txt:tier};

  const lbl = d.label && d.label !== st.txt ? d.label : st.txt;
  let head = `<span class="badge ${st.cls}">${esc(lbl)}</span>`;
  if(d.confidence != null) head += ` <span class="sc">confiance ${d.confidence}</span>`;
  if(d.cached) head += ` <span class="sc">· réponse en cache</span>`;
  if(d.audience === "teleassistance") head += ` <span class="sc">· base téléassistance</span>`;
  $("#head").innerHTML = head;

  $("#answer").textContent = d.response || d.error || "(pas de réponse)";
  $("#answer").className = "answer" + (d.status === "error" ? " err" : "");

  const f = d.fiches || [];
  $("#fiches").innerHTML = f.length ? (
    `<div class="fiches"><h4>Fiches</h4>` + f.map(x => {
      const name = x.titre ? `${x.code} — ${esc(x.titre)}` : x.code;
      const link = x.source_url ? `<a href="${x.source_url}" target="_blank" rel="noopener">${esc(name)}</a>` : esc(name);
      const sc = x.score != null ? ` <span class="sc">(${x.score})</span>` : "";
      const sec = x.section ? ` <span class="sc">§${esc(x.section)}</span>` : "";
      return `<div class="fiche">• ${link}${sec}${sc}</div>`;
    }).join("") + `</div>`
  ) : "";

  let extra = "";
  if(CASCADE.includes(tier))
    extra = `<div class="warnbar">Cette réponse n'est <b>pas</b> adossée à une fiche CPA validée — à vérifier avant de la transmettre.</div>`;
  if(tier === "RAG-redaction")
    extra = `<div class="warnbar">Brouillon généré à partir des fiches — <b>relisez-le</b> et adaptez avant envoi à l'utilisateur.</div>`;
  if(tier === "aucune-fiche")
    extra = `<div class="note">Aucune procédure ne couvre précisément ce point. Signalez-le au chef de cellule pour compléter la documentation.</div>`;
  $("#extra").innerHTML = extra;
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

async function send(){
  const query = $("#q").value.trim();
  if(!query) return;
  const mode = document.querySelector('input[name=mode]:checked').value;
  $("#go").disabled = true; $("#spin").hidden = false; $("#out").hidden = true;
  try{
    const r = await fetch("query", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({query, mode})});
    render(await r.json());
  }catch(e){
    render({status:"error", tier:"?", error:"Erreur réseau : " + e.message});
  }finally{
    $("#go").disabled = false; $("#spin").hidden = true;
  }
}
$("#go").onclick = send;
$("#q").addEventListener("keydown", e => { if(e.ctrlKey && e.key === "Enter") send(); });
</script>
</body>
</html>
