# config/screening.yaml — filtres déterministes en amont de tout modèle.
# Deux voies :
#   - safeguarding : signaux de détresse / mise en danger → carte d'aide, AUCUN modèle,
#     aucun ticket, aucun cache. Priorité absolue.
#   - out_of_scope : l'outil ne traite QUE le support informatique de la CPA.
#
# Édition libre par l'opérateur. Rechargé à chaque démarrage du service langgraph.
version: 1

safeguarding:
  # Passer à `true` UNIQUEMENT après validation formelle des numéros par la DSI.
  # Tant que c'est `false`, /health signale la carte comme non validée et la carte
  # elle-même porte un avertissement.
  validated: false
  # ⚠️ NUMÉROS À VÉRIFIER / COMPLÉTER PAR L'OPÉRATEUR avant mise en service réelle.
  # Correspondance insensible à la casse et aux accents ; sous-chaîne simple.
  # NOYAUX courts (pas des phrases entières) : le coût d'un faux positif (carte d'aide
  # affichée à tort) est sans commune mesure avec celui d'un faux négatif. Voir E5.
  patterns:
    - suicide
    - suicider
    - en finir           # « je pense à en finir », « en finir avec tout ça »
    - mettre fin a mes jours
    - envie de mourir
    - envie de disparaitre
    - plus envie de vivre
    - plus envie de rien
    - plus gout a rien
    - je craque
    - je n'en peux plus de vivre
    - je n'ai plus la force
    - me faire du mal
    - se faire du mal
    - faire du mal
    - me tuer
    - passer a l'acte
    - mettre fin a mes jours
    - violence conjugale
    - il me frappe
    - elle me frappe
    - harcelement moral
    - je suis en danger
    - on me menace
    - maltraitance
  card: |
    ⚠️ Situation sensible détectée.

    Cet outil ne traite pas ce type de demande. Si une personne (usager ou collègue)
    exprime une souffrance ou une mise en danger :

    • Urgences : SAMU 15 · Gendarmerie / Police 17 · Pompiers 18
    • SOS Suicide Polynésie : 40 44 47 48 (24 h/24, 7 j/7)
    • Pour un agent en difficulté : cellule d'écoute de la DRH / médecine du travail
      (coordonnées à compléter par la DSI)

    Ne restez pas seul face à la situation : prévenez votre hiérarchie.

out_of_scope:
  # Carte hors-périmètre déclenchée SI :
  #   (un motif `patterns` ci-dessous correspond)  ET  (aucun terme `scope_lexicon`)
  #   ET  (le RAG n'a renvoyé aucune fiche exploitable).
  # Blocklist volontairement étroite : mieux vaut répondre que refuser à tort.
  patterns:
    - capitale de
    - capitale du
    - population de
    - combien d'habitants
    - qui a inventé
    - qui a gagné
    - qui a écrit
    - en quelle année
    - quelle est la date de
    - recette
    - ecris moi un
    - ecris-moi un
    - ecris moi une
    - ecris-moi une
    - redige moi un poeme
