global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - '/etc/prometheus/alerts.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'langgraph'
    static_configs:
      - targets: ['langgraph:8888']
    metrics_path: '/metrics'

  - job_name: 'anone'
    static_configs:
      - targets: ['anone:8080']
    metrics_path: '/metrics'

  - job_name: 'rag'
    static_configs:
      - targets: ['rag:8090']
    metrics_path: '/metrics'

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
