<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign AI Chat - T1→T2 Cascade</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
            height: 100vh;
            display: flex;
            overflow: hidden;
            color: #e2e8f0;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .sidebar {
            width: 280px;
            background: rgba(15, 23, 42, 0.8);
            border-right: 1px solid rgba(100, 116, 139, 0.3);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(100, 116, 139, 0.3);
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #60a5fa;
        }

        .sidebar-subtitle {
            font-size: 12px;
            color: #94a3b8;
        }

        .models-section {
            margin-bottom: 30px;
        }

        .models-title {
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 12px;
        }

        .model-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            border: 2px solid rgba(100, 116, 139, 0.3);
            background: rgba(30, 58, 138, 0.5);
            color: #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            text-align: left;
        }

        .model-btn:hover {
            background: rgba(59, 130, 246, 0.3);
            border-color: #60a5fa;
        }

        .model-btn.active {
            background: #3b82f6;
            border-color: #60a5fa;
        }

        .model-info {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-t1 {
            background: #10b981;
        }

        .status-t2 {
            background: #f59e0b;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid rgba(100, 116, 139, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 20px;
            font-weight: bold;
            color: #60a5fa;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
        }

        .status-dot.disconnected {
            background: #ef4444;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: #3b82f6;
            color: white;
        }

        .message.assistant .message-content {
            background: rgba(51, 65, 85, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .message.assistant .message-content p {
            margin: 12px 0;
            line-height: 1.6;
        }

        .message.assistant .message-content ul,
        .message.assistant .message-content ol {
            margin: 12px 0;
            padding-left: 24px;
        }

        .message.assistant .message-content li {
            margin: 6px 0;
            line-height: 1.6;
        }

        .message.assistant .message-content strong {
            color: #60a5fa;
            font-weight: bold;
        }

        .message.assistant [data-response] {
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.6;
        }

        .message-header {
            font-size: 11px;
            margin-bottom: 6px;
            color: #94a3b8;
        }

        .model-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            margin-left: 8px;
        }

        .tier-1 {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .tier-2 {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid rgba(100, 116, 139, 0.3);
            display: flex;
            gap: 12px;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            gap: 8px;
        }

        .input-wrapper input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid rgba(100, 116, 139, 0.3);
            background: rgba(30, 58, 138, 0.3);
            color: #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #60a5fa;
            background: rgba(30, 58, 138, 0.5);
        }

        .input-wrapper input::placeholder {
            color: #64748b;
        }

        button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 14px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(59, 130, 246, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        #screenshotBtn {
            padding: 12px 16px;
            font-size: 18px;
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
        }

        #screenshotBtn:hover {
            box-shadow: 0 8px 16px rgba(139, 92, 246, 0.3);
        }

        .streaming {
            display: inline-block;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0.3; }
        }

        .complexity-meter {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .complexity-bar {
            width: 40px;
            height: 4px;
            background: rgba(100, 116, 139, 0.3);
            border-radius: 2px;
            overflow: hidden;
        }

        .complexity-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981 0%, #f59e0b 100%);
            transition: width 0.3s;
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #64748b;
            text-align: center;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        /* Scrollbar */
        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: rgba(100, 116, 139, 0.1);
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.3);
            border-radius: 3px;
        }

        .chat-container::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 116, 139, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">🤖 Sovereign AI</div>
                <div class="sidebar-subtitle">Cascade T1→T2→T3</div>
            </div>

            <div class="models-section">
                <div class="models-title">Modèles Disponibles</div>

                <button class="model-btn active" data-model="auto">
                    <div>⚡ Auto (Recommandé)</div>
                    <div class="model-info">T1 par défaut, T2 si complexe</div>
                </button>

                <button class="model-btn" data-model="t1">
                    <span class="status-indicator status-t1"></span>
                    <strong>T1 - Mistral 7B</strong>
                    <div class="model-info">Rapide (3-4s), français</div>
                </button>

                <button class="model-btn" data-model="t2">
                    <span class="status-indicator status-t2"></span>
                    <strong>T2 - Llama2 7B</strong>
                    <div class="model-info">Analyse approfondie (4-5s)</div>
                </button>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="main-content">
            <!-- Header -->
            <div class="header">
                <div class="header-title">Chat IA</div>
                <div class="connection-status">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">Connexion...</span>
                </div>
            </div>

            <!-- Chat Messages -->
            <div class="chat-container" id="chatContainer">
                <div class="empty-state">
                    <div>
                        <div class="empty-icon">💬</div>
                        <div>Posez une question pour commencer</div>
                        <div style="font-size: 12px; margin-top: 8px; color: #64748b;">
                            L'IA choisira automatiquement T1 (rapide) ou T2 (détaillé)
                        </div>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-wrapper">
                    <input
                        type="text"
                        id="messageInput"
                        placeholder="Tapez votre question..."
                        autocomplete="off"
                    >
                    <button id="sendBtn" onclick="sendMessage()">Envoyer</button>
                    <button id="screenshotBtn" onclick="captureChat()" title="Capturer le chat">📸</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        let ws = null;
        let selectedModel = "auto";
        let isConnected = false;

        // Format text with proper HTML structure - convert \n to <br>
        function formatTextWithLineBreaks(text) {
            // First, escape HTML and replace \n with <br>
            let html = escapeHtml(text)
                .replace(/\n\n/g, '</p><p>')  // Paragraphs
                .replace(/\n/g, '<br>');       // Line breaks

            // Format bold text
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

            // Wrap in paragraph tags if not already there
            if (!html.startsWith('<p>')) {
                html = '<p>' + html + '</p>';
            }

            // Fix multiple <p> tags
            html = html.replace(/<\/p><p>/g, '</p><p style="margin-top: 12px;">');

            // Add styles to all p tags
            html = html.replace(/<p>/g, '<p style="margin: 12px 0; line-height: 1.6;">');
            html = html.replace(/<br>/g, '<br style="margin: 6px 0;">');

            return html;
        }

        // Capture chat as image
        async function captureChat() {
            const chatContainer = document.getElementById('chatContainer');
            const screenshotBtn = document.getElementById('screenshotBtn');

            try {
                screenshotBtn.disabled = true;
                screenshotBtn.textContent = '⏳';

                const canvas = await html2canvas(chatContainer, {
                    backgroundColor: '#0f172a',
                    scale: 2,
                    logging: false,
                    useCORS: true,
                    allowTaint: true
                });

                // Create download link
                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/png');
                link.download = `sovereign-chat-${new Date().toISOString().slice(0,10)}.png`;
                link.click();

                screenshotBtn.textContent = '✅';
                setTimeout(() => {
                    screenshotBtn.textContent = '📸';
                    screenshotBtn.disabled = false;
                }, 2000);
            } catch (error) {
                console.error('Erreur capture:', error);
                screenshotBtn.textContent = '❌';
                setTimeout(() => {
                    screenshotBtn.textContent = '📸';
                    screenshotBtn.disabled = false;
                }, 2000);
            }
        }

        // Configure markdown rendering
        marked.setOptions({
            breaks: true,
            gfm: true,
            pedantic: false
        });

        // Connect to WebSocket
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/chat`);

            ws.onopen = () => {
                isConnected = true;
                updateStatus(true);
                console.log('✅ WebSocket connecté');
            };

            ws.onerror = (error) => {
                console.error('❌ Erreur WebSocket:', error);
                updateStatus(false);
            };

            ws.onclose = () => {
                isConnected = false;
                updateStatus(false);
                setTimeout(connectWebSocket, 3000);
            };

            ws.onmessage = (event) => {
                handleMessage(JSON.parse(event.data));
            };
        }

        function updateStatus(connected) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            if (connected) {
                dot.classList.remove('disconnected');
                text.textContent = 'Connecté';
            } else {
                dot.classList.add('disconnected');
                text.textContent = 'Déconnecté';
            }
        }

        function handleMessage(data) {
            const container = document.getElementById('chatContainer');

            if (data.type === 'model_selected') {
                const lastMessage = container.lastElementChild;
                if (lastMessage && lastMessage.classList.contains('assistant')) {
                    const header = lastMessage.querySelector('.message-header');
                    const tier = data.tier === 1 ? 'T1' : 'T2';
                    const tierClass = `tier-${data.tier}`;
                    header.innerHTML = `
                        <span>Modèle sélectionné:</span>
                        <span class="model-badge ${tierClass}">${tier}</span>
                        <span> (${data.reason})</span>
                    `;
                }
            } else if (data.type === 'chunk') {
                const lastMessage = container.lastElementChild;
                if (lastMessage && lastMessage.classList.contains('assistant')) {
                    const content = lastMessage.querySelector('.message-content');
                    const responseDiv = content.querySelector('[data-response]');
                    if (responseDiv) {
                        // Store raw text
                        if (!responseDiv.dataset.rawText) {
                            responseDiv.dataset.rawText = '';
                        }
                        responseDiv.dataset.rawText += data.data;

                        // Display as pre-formatted text with line breaks preserved
                        // Convert markdown-style text to HTML for better display
                        let displayText = responseDiv.dataset.rawText;
                        responseDiv.textContent = '';
                        responseDiv.innerHTML = formatTextWithLineBreaks(displayText);
                    }
                }
                container.scrollTop = container.scrollHeight;
            } else if (data.type === 'streaming_complete') {
                const lastMessage = container.lastElementChild;
                if (lastMessage && lastMessage.classList.contains('assistant')) {
                    const content = lastMessage.querySelector('.message-content');
                    const responseDiv = content.querySelector('[data-response]');
                    content.classList.remove('streaming');

                    // Render markdown AFTER streaming is complete
                    if (responseDiv && responseDiv.dataset.rawText) {
                        try {
                            // Try to render as markdown
                            responseDiv.innerHTML = marked(responseDiv.dataset.rawText);
                        } catch (e) {
                            // Fallback to formatted text if markdown fails
                            responseDiv.innerHTML = formatTextWithLineBreaks(responseDiv.dataset.rawText);
                        }
                    }
                }
            } else if (data.type === 'error') {
                addMessage(`Erreur: ${data.message}`, 'assistant');
            }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message || !isConnected) return;

            // Add user message
            addMessage(message, 'user');

            // Clear input
            input.value = '';

            // Add assistant message placeholder
            addMessage('', 'assistant');

            // Send message
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    message: message,
                    force_model: selectedModel === 'auto' ? null : selectedModel
                }));
            }
        }

        function addMessage(text, role) {
            const container = document.getElementById('chatContainer');

            // Remove empty state if first message
            if (container.querySelector('.empty-state')) {
                container.innerHTML = '';
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            if (role === 'assistant') {
                messageDiv.innerHTML = `
                    <div class="message-content">
                        <div class="message-header">
                            <span class="streaming">⏳ En attente...</span>
                        </div>
                        <div data-response style="margin-top: 8px;"></div>
                    </div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <div class="message-content">${escapeHtml(text)}</div>
                `;
            }

            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Model selection
        document.querySelectorAll('.model-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedModel = this.dataset.model;
            });
        });

        // Send on Enter
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Initialize
        connectWebSocket();
    </script>
</body>
</html>
