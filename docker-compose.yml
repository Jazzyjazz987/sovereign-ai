version: '3.9'

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./scripts/ollama_init.sh:/docker-entrypoint.d/init.sh
    environment:
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-2}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-2}
      - OLLAMA_CPU_ONLY=${OLLAMA_CPU_ONLY:-1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_DEVICE_COUNT:-0}
              capabilities: [compute, utility]
    networks:
      - sovereign-ai
    healthcheck:
      # L'image ollama/ollama n'embarque ni curl ni wget ; `ollama ps` renvoie 0 si le serveur répond.
      test: ["CMD", "ollama", "ps"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: claude
      POSTGRES_DB: langgraph_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres_init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - sovereign-ai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claude"]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:main
    ports:
      - "4000:4000"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - VLLM_API_KEY=${VLLM_API_KEY}
    volumes:
      - ./config/litellm_config.yaml:/app/litellm_config.yaml
    # L'ENTRYPOINT de l'image est en forme shell (litellm --config /app/proxy_server_config.yaml)
    # et ignore `command:`. On surcharge l'entrypoint pour charger notre config.
    entrypoint: ["litellm", "--config", "/app/litellm_config.yaml", "--port", "4000"]
    networks:
      - sovereign-ai
    depends_on:
      ollama:
        condition: service_started

  anone:
    build:
      context: ./api
      dockerfile: Dockerfile.anone
    ports:
      - "8080:8080"
    environment:
      - HF_TOKEN=${HF_TOKEN}
    networks:
      - sovereign-ai

  langgraph:
    build:
      context: ./api
      dockerfile: Dockerfile.langgraph
    ports:
      - "8888:8888"
    volumes:
      - ./api/static:/app/static
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - POSTGRES_DSN=postgresql://claude:${POSTGRES_PASSWORD}@postgres:5432/langgraph_db
      - LITELLM_API_KEY=${LITELLM_MASTER_KEY}
      - OLLAMA_URL=http://ollama:11434
      - T5_MODEL=${T5_MODEL:-claude-sonnet-5}
      - T5_MAX_TOKENS=${T5_MAX_TOKENS:-700}
      - T5_MAX_CALLS=${T5_MAX_CALLS:-150}
      - T5_MODERATION=${T5_MODERATION:-off}
      - T5_APPROVAL_TIMEOUT=${T5_APPROVAL_TIMEOUT:-60}
      - T5_NOTIFY_WEBHOOK=${T5_NOTIFY_WEBHOOK:-}
    depends_on:
      postgres:
        condition: service_started
      litellm:
        condition: service_started
      ollama:
        condition: service_started
      anone:
        condition: service_started
    networks:
      - sovereign-ai

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/prometheus_alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - sovereign-ai

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana_datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    depends_on:
      - prometheus
    networks:
      - sovereign-ai

volumes:
  ollama_data:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  sovereign-ai:
    driver: bridge
