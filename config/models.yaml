# config/models.yaml — source de vérité « quels poids tournent »
# Voir docs/DESIGN_REVIEW.md § POC SHORTLIST A1 + round 3.
# Matériel (confirmé 2026-09-05) : NVIDIA GeForce RTX 3080 Ti, 12 Go VRAM (11,6 Gio dispo),
# driver 580.173.02 / CUDA 13.0. ~145 tok/s sur un 7B.
# Budget : OLLAMA_MAX_LOADED_MODELS=1, UN modèle 7-8B GGUF Q4 sur GPU à la fois (~5-6 Go),
# swap à la demande. GLiNER + e5-base restent sur CPU.

# --- Modèles actifs -----------------------------------------------------------------
actifs:
  tier_local:
    tag_ollama: "qwen2.5:7b"
    role: "T1-T4 — tous les tiers locaux (non encore différenciés)"
    base: "Qwen2.5 7B Instruct"
    quant: "Q4_K_M (~4,7 Go)"
    licence: "Apache-2.0"
    provenance: "vendor (Alibaba Qwen)"
    proprietaire: "CPA"
    note: "choisi vs mistral:7b (2026-09-05) : suit le prompt système, refuse d'halluciner
           les références juridiques. mistral:7b inventait le CGCT pour la fonction publique PF."

  agent_anone_pii:
    modele: "urchade/gliner_multi_pii-v1"
    role: "détection PII avant T5"
    provenance: "communauté (GLiNER)"
    proprietaire: "CPA — critique (fail-closed sur mismatch)"

# --- Candidats tier juridique / administratif (à comparer, POC) ---------------------
# Projet jumeau : Albert / Guillaume Tell (DINUM / Etalab) — IA du gouvernement français
# POUR les agents administratifs. Fine-tunés pour la RÉPONSE CITÉE sur corpus admin
# (service-public.fr) = exactement le « portail à fiches citées » validé.
# ⚠️ Entraînés sur le droit MÉTROPOLITAIN, pas le droit polynésien (Lexpol / JOPF).
# La valeur = le comportement de citation + registre admin-FR ; le corpus RAG (Lexpol +
# service-public.pf + fiches CPA internes) est le vrai différenciateur.
# Comparaison faite le 2026-09-05 -> docs/design-review/model-comparison-2026-09-05.md
# Verdict : les 2 sont des modèles RAG-only, INUTILISABLES NUS. À reprendre quand la couche
# RAG existe (POC SHORTLIST B5) + un GGUF au bon template.
candidats_juridique_admin:
  - tag_ollama: "hf.co/mradermacher/guillaumetell-7b-GGUF:Q4_K_M"
    base: "OpenHermes-2.5-Mistral-7B (fine-tune LoRA RAG service-public.fr)"
    licence: "Apache-2.0"
    provenance: "AgentPublic / Etalab / DINUM (souverain FR)"
    optimise_pour: "RAG + citation de source (~5 docs sources)"
    statut: "PULLÉ — écarté pour l'instant : GGUF mradermacher au template cassé (boucle fanfic
             sur prompts non juridiques) ; hallucine un contexte RAG ('EncycloLQ'). Reprendre avec
             un autre GGUF (EZPK / Marmeelade / officiel) + Modelfile ChatML + couche RAG."

  - tag_ollama: "hf.co/mradermacher/albert-spp-8b-GGUF:Q4_K_M"
    base: "Llama 3 8B (fine-tune Albert 'spp', janv. 2025)"
    licence: "Llama 3 Community License (à vérifier)"
    provenance: "AgentPublic / Etalab / DINUM (souverain FR)"
    statut: "PULLÉ — écarté : bloqué en persona 'réponse auto à réclamation citoyenne', répond
             hors-sujet à tout. RAG-only."

# Prochaine piste tier généraliste (mistral:7b est faible) :
candidats_generaliste:
  - "Qwen2.5-7B-Instruct GGUF Q4_K_M — fort en français, licence Apache-2.0"
  - "Ministral-8B-Instruct GGUF — Mistral, français natif (licence de recherche à vérifier)"

# --- Écartés ----------------------------------------------------------------------
ecartes:
  - modele: "dolphin-mixtral:latest"
    raison: "fine-tune 'uncensored' (entraînement au refus supprimé) ; Mixtral 8x7B ~26 Go, ne rentre pas sur 16 Go ; inutilisable à ~3 tok/s. À RETIRER de ollama_init.sh + api/main.py TIERS."
  - modele: "neural-chat:latest"
    raison: "repack communautaire non maintenu ; non vérifié pour un usage gouvernemental."
  - modele: "Apertus 70B (Swiss AI)"
    raison: "souverain EU mais 70B — impossible sur 16 Go."
  - modele: "vLLM T3/T4 AWQ 14B/22B toujours actifs"
    raison: "budget ~21 Go — impossible sur 16 Go. Architecture = Ollama swap à la demande."

