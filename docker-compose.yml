# Stack Sovereign AI — DSI Polynésie française.
# Tous les ports du plan de données sont liés à 127.0.0.1 (boîte mono-utilisateur en
# local badgé ; un proxy d'identité devant :8888 est prévu en Phase 2). L'accès à
# Grafana/Prometheus depuis un poste = tunnel SSH.

services:
  ollama:
    restart: unless-stopped
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./scripts/ollama_init.sh:/docker-entrypoint.d/init.sh
    environment:
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-2}
      - OLLAMA_CPU_ONLY=${OLLAMA_CPU_ONLY:-1}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_DEVICE_COUNT:-0}
              capabilities: [compute, utility]
    networks:
      - sovereign-ai
    healthcheck:
      # L'image ollama/ollama n'embarque ni curl ni wget ; `ollama ps` renvoie 0 si le serveur répond.
      test: ["CMD", "ollama", "ps"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    restart: unless-stopped
    # pgvector/pgvector:pg16 = postgres 16 + extension vector (RAG). Même major que
    # postgres:16-alpine → le volume postgres_data reste compatible.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: claude
      POSTGRES_DB: langgraph_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres_init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - sovereign-ai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claude"]
      interval: 10s
      timeout: 5s
      retries: 5

  anone:
    restart: unless-stopped
    build:
      context: ./api
      dockerfile: Dockerfile.anone
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HF_HOME=/models/hf
      - ANONE_MODEL=${ANONE_MODEL:-urchade/gliner_multi_pii-v1}
      - ANONE_THRESHOLD=${ANONE_THRESHOLD:-0.4}
    volumes:
      # Cache modèles HuggingFace persistant (GLiNER ~1,2 Go) — évite le re-téléchargement
      # à chaque rebuild/recreate du conteneur (B14).
      - anone_hf_cache:/models/hf
    networks:
      - sovereign-ai

  rag:
    restart: unless-stopped
    build:
      context: ./rag
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      - POSTGRES_DSN=postgresql://claude:${POSTGRES_PASSWORD}@postgres:5432/langgraph_db
      - RAG_PG_DSN=postgresql://claude:${POSTGRES_PASSWORD}@postgres:5432/langgraph_db
      - HF_HOME=/models/hf
      # Modèles embarqués dans l'image (C5) => hors-ligne par défaut. Mettre à 0 dans .env
      # seulement pour un premier build / une MAJ de modèle.
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
      - RAG_RERANK=${RAG_RERANK:-on}
      - RAG_TORCH_THREADS=${RAG_TORCH_THREADS:-8}
      - RAG_MAX_CONCURRENCY=${RAG_MAX_CONCURRENCY:-3}
      # /ingest désactivé par défaut ; poser un jeton pour l'activer (header X-Admin-Token).
      - RAG_ADMIN_TOKEN=${RAG_ADMIN_TOKEN:-}
    volumes:
      - rag_hf_cache:/models/hf
      - ./corpus:/corpus:ro
      - ./config/rag:/app/config/rag:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sovereign-ai
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8090/health',timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

  langgraph:
    restart: unless-stopped
    build:
      context: ./api
      dockerfile: Dockerfile.langgraph
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ./api/static:/app/static
      - ./config:/app/config:ro
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - POSTGRES_DSN=postgresql://claude:${POSTGRES_PASSWORD}@postgres:5432/langgraph_db
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-90}
      - OLLAMA_NUM_PREDICT=${OLLAMA_NUM_PREDICT:-600}
      - RAG_URL=${RAG_URL:-http://rag:8090}
      - RAG_ENABLED=${RAG_ENABLED:-on}
      - RAG_STRICT=${RAG_STRICT:-on}
      - RAG_CACHE_TTL=${RAG_CACHE_TTL:-3600}
      - QUERY_DEADLINE=${QUERY_DEADLINE:-180}
      # T5 = escalade « inférence centrale ». Intérim = API Anthropic. Modération ON par
      # défaut (garde-fou budget + souveraineté) — voir docs/REVUE_CRITIQUE_2026-09-07.md.
      - T5_MODEL=${T5_MODEL:-claude-sonnet-5}
      - T5_MAX_TOKENS=${T5_MAX_TOKENS:-700}
      - T5_MAX_CALLS=${T5_MAX_CALLS:-150}
      - T5_MODERATION=${T5_MODERATION:-on}
      - T5_APPROVAL_TIMEOUT=${T5_APPROVAL_TIMEOUT:-60}
      - T5_NOTIFY_WEBHOOK=${T5_NOTIFY_WEBHOOK:-}
    depends_on:
      postgres:
        condition: service_started
      ollama:
        condition: service_started
      anone:
        condition: service_started
      rag:
        condition: service_started
    networks:
      - sovereign-ai

  # --- Observabilité ---------------------------------------------------------------
  node-exporter:
    restart: unless-stopped
    image: prom/node-exporter:latest
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - sovereign-ai

  postgres-exporter:
    restart: unless-stopped
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      - DATA_SOURCE_NAME=postgresql://claude:${POSTGRES_PASSWORD}@postgres:5432/langgraph_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_started
    networks:
      - sovereign-ai

  # Monitoring GPU : via `nvidia-smi` sur l'hôte pour l'instant (watch -n2 nvidia-smi).
  # Un exporter dédié (dcgm-exporter) demande de la conf runtime — reporté.

  prometheus:
    restart: unless-stopped
    image: prom/prometheus:latest
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/prometheus_alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - sovereign-ai

  grafana:
    restart: unless-stopped
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana_datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./config/grafana_dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./config/grafana_dashboard_rag.json:/etc/grafana/provisioning/dashboards/rag.json
      - ./config/grafana_dashboard_stack.json:/etc/grafana/provisioning/dashboards/stack.json
    depends_on:
      - prometheus
    networks:
      - sovereign-ai

volumes:
  ollama_data:
  postgres_data:
  prometheus_data:
  grafana_data:
  anone_hf_cache:
  rag_hf_cache:

networks:
  sovereign-ai:
    driver: bridge
